# Render Blueprint — Bondly Commercial Platform (§27 / Autenticação Opção B)
#
# ARQUITETURA (Opção B — login Google + proxy de borda):
# O deploy deixa de ser Static Site e passa a ser um WEB SERVICE Node (@bondly/auth-proxy) que:
#   1. faz o OAuth Google (Authorization Code + PKCE) e valida o ID token NO SERVIDOR;
#   2. autoriza por domínio exato (minu.co, minutrade.com, grupoarka.co, brain3.com.br, coremidia.co);
#   3. cria sessão em cookie HttpOnly/Secure/SameSite e SÓ ENTÃO serve o dist do SPA.
# Sem sessão válida o navegador nem baixa o bundle — a proteção não é apenas visual.
#
# LIMITE HONESTO (§5): as regras de pricing seguem no bundle entregue a um usuário AUTORIZADO.
# Este proxy barra quem não tem sessão; não cifra o conteúdo de quem já entrou. Mover cálculo/dados
# para o servidor seria a Opção A. Ver docs/09-autenticacao-e-seguranca.md.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bondly-simulator2
    runtime: node
    plan: starter
    # Build do monorepo: compila o SPA (dist) e o servidor TypeScript (dist/server.js).
    buildCommand: npm ci && npm run build --workspace @bondly/commercial-workspace && npm run build --workspace @bondly/auth-proxy
    startCommand: npm run start --workspace @bondly/auth-proxy
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # STATIC_DIR aponta para o dist do SPA relativo ao processo do servidor.
      - key: STATIC_DIR
        value: /opt/render/project/src/apps/commercial-workspace/dist
      # PUBLIC_URL deve ser a URL pública real do serviço (ou domínio personalizado).
      # Fixada no host do novo Web Service; se o Render gerar sufixo diferente, ajuste no painel.
      - key: PUBLIC_URL
        value: https://bondly-simulator2.onrender.com
      # Segredos — configurar no painel (Environment), NUNCA commitar:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
