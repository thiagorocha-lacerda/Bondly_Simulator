# Render Blueprint — Bondly Commercial Platform (§27 / Autenticação Opção B)
#
# ARQUITETURA (Opção B — login Google + proxy de borda):
# O deploy deixa de ser Static Site e passa a ser um WEB SERVICE Node (@bondly/auth-proxy) que:
#   1. faz o OAuth Google (Authorization Code + PKCE) e valida o ID token NO SERVIDOR;
#   2. autoriza por domínio exato (minu.co, minutrade.com, grupoarka.co, brain3.com.br, coremidia.co);
#   3. cria sessão em cookie HttpOnly/Secure/SameSite e SÓ ENTÃO serve o dist do SPA.
# Sem sessão válida o navegador nem baixa o bundle — a proteção não é apenas visual.
#
# LIMITE HONESTO (§5): as regras de pricing seguem no bundle entregue a um usuário AUTORIZADO.
# Este proxy barra quem não tem sessão; não cifra o conteúdo de quem já entrou. Mover cálculo/dados
# para o servidor seria a Opção A. Ver docs/09-autenticacao-e-seguranca.md.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: bondly-simulator2
    runtime: node
    # Plano Starter (~US$ 7/mês): backend Node completo (OAuth/RBAC/2º fator/APIs/esteira/SLA),
    # NÃO dorme, e com o Disk abaixo PERSISTE (SQLite) propostas e eventos de SLA entre redeploys.
    # Para custo zero de validação (sem persistência), trocar para plan: free + remover DATA_DIR e disk.
    plan: starter
    # Build do monorepo: compila o SPA (dist) e o servidor TypeScript (dist/server.js).
    buildCommand: npm ci && npm run build --workspace @bondly/pricing-engine && npm run build --workspace @bondly/commercial-workspace && npm run build --workspace @bondly/auth-proxy
    startCommand: npm run start --workspace @bondly/auth-proxy
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # STATIC_DIR aponta para o dist do SPA relativo ao processo do servidor.
      - key: STATIC_DIR
        value: /opt/render/project/src/apps/commercial-workspace/dist
      # PUBLIC_URL deve ser a URL pública real do serviço (ou domínio personalizado).
      # Fixada no host do novo Web Service; se o Render gerar sufixo diferente, ajuste no painel.
      - key: PUBLIC_URL
        value: https://bondly-simulator2.onrender.com
      # Segredos — configurar no painel (Environment), NUNCA commitar:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Persistência (Fase 3 + SLA): SQLite no Disk montado em /var/data. Com DATA_DIR setado o
      # createRepository escolhe o backend SQLite; sem ele, cai para in-memory (dev/Free).
      - key: DATA_DIR
        value: /var/data
      # Códigos de perfil (2º fator §7.2) — HASHES scrypt gerados com scryptHasher.hash, NUNCA o código
      # em texto puro. Opcionais: um papel sem hash fica inatingível. Configurar no painel.
      - key: PROFILE_CODE_HASH_BUSINESS
        sync: false
      - key: PROFILE_CODE_HASH_TECH
        sync: false
      - key: PROFILE_CODE_HASH_ADMIN
        sync: false
    # Disk persistente (Starter): SQLite sobrevive a redeploy/restart. Para Free, remover este bloco,
    # a env DATA_DIR acima, e trocar plan: starter -> free (o repositório volta a in-memory).
    disk:
      name: bondly-data
      mountPath: /var/data
      sizeGB: 1
