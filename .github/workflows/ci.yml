name: CI

# Executa typecheck/testes/build antes de qualquer versão ser considerada apta à publicação
# (prompt §27.3). A Render só deve promover para produção (auto-deploy no push) um commit que passou por aqui.
# (Lint/ESLint ainda não configurado — ver roadmap docs/08; o typecheck strict cobre boa parte.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Testes · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Build do Pricing Engine (dependência buildada dos demais workspaces)
        # O engine expõe dist/index.js em package.json#exports; auth-proxy o consome pelo dist.
        # Precisa existir ANTES de typecheck/testes — senão a resolução do pacote falha no runner limpo.
        run: npm run build --workspace @bondly/pricing-engine

      - name: Typecheck (todos os workspaces)
        run: npm run typecheck

      - name: Testes (engine + UI + auth-proxy — paridade §12/§16 + segurança do gate)
        run: npm run test

      - name: Build do Commercial Workspace
        run: npm run build --workspace @bondly/commercial-workspace

      - name: Build do Auth Proxy (Web Service)
        run: npm run build --workspace @bondly/auth-proxy

      - name: Verificar artefato de build
        run: test -f apps/commercial-workspace/dist/index.html && test -f apps/auth-proxy/dist/server.js && echo "dist OK"

      - name: Auditoria de dependências (caminho de produção)
        run: npm audit --omit=dev --audit-level=high
